openapi: 3.0.3
info:
  title: notification-service
  version: 1.0.0
  description: Push о записях и лекарствах. Один текущий токен пользователя; SENT — принятие FCM, не прочтение.
servers:
- url: https://api.pet-care.example
  description: API Gateway
security:
- userJwt: []
tags:
- name: public
  description: Клиент через Gateway
- name: internal
  description: Внутренняя сеть, service JWT
- name: webhook
  description: Подписанный callback PSP
paths:
  /api/v1/device:
    put:
      tags:
      - public
      operationId: notification_service_put_api_v1_device
      summary: Зарегистрировать текущее устройство
      description: 'Доступ: OWNER. Upsert по sub, токен уникален.'
      security:
      - userJwt: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pushToken:
                  type: string
              required:
              - pushToken
              additionalProperties: false
            example:
              pushToken: example-fcm-token
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
              example:
                ok: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/notifications:
    get:
      tags:
      - public
      operationId: notification_service_get_api_v1_notifications
      summary: История уведомлений владельца
      description: 'Доступ: OWNER. Только свои записи, сортировка scheduledAt,id.'
      security:
      - userJwt: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                - id: 66666666-6666-4666-8666-666666666666
                  kind: APPOINTMENT_CONFIRMED
                  scheduledAt: '2027-01-15T09:15:00Z'
                  status: SENT
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - APPOINTMENT_CONFIRMED
          - APPOINTMENT_CANCELLED
          - MEDICATION
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
          - CANCELLED
      required:
      - id
      - kind
      - scheduledAt
      - status
      additionalProperties: false
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
