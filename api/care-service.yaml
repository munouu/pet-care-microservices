openapi: 3.0.3
info:
  title: care-service
  version: 1.0.0
  description: Бытовые дела и объединённый календарь. Медицинские строки — только проекция health-service.
servers:
- url: https://api.pet-care.example
  description: API Gateway
security:
- userJwt: []
tags:
- name: public
  description: Клиент через Gateway
- name: internal
  description: Внутренняя сеть, service JWT
- name: webhook
  description: Подписанный callback PSP
paths:
  /api/v1/care/tasks:
    post:
      tags:
      - public
      operationId: care_service_post_api_v1_care_tasks
      summary: Запланировать дело
      description: 'Доступ: OWNER. Владелец проверяется через pet-service. Время в будущем.'
      security:
      - userJwt: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
            example:
              petId: 22222222-2222-4222-8222-222222222222
              title: Кормление
              scheduledAt: '2027-01-15T10:00:00Z'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 66666666-6666-4666-8666-666666666666
                petId: 22222222-2222-4222-8222-222222222222
                title: Кормление
                scheduledAt: '2027-01-15T10:00:00Z'
                status: PENDING
                completedAt: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      tags:
      - public
      operationId: care_service_get_api_v1_care_tasks
      summary: Список дел
      description: 'Доступ: OWNER. '
      security:
      - userJwt: []
      parameters:
      - name: petId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 22222222-2222-4222-8222-222222222222
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
              example:
                items:
                - id: 66666666-6666-4666-8666-666666666666
                  petId: 22222222-2222-4222-8222-222222222222
                  title: Кормление
                  scheduledAt: '2027-01-15T10:00:00Z'
                  status: PENDING
                  completedAt: null
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/care/tasks/{taskId}/completion:
    put:
      tags:
      - public
      operationId: care_service_put_api_v1_care_tasks_taskId_completion
      summary: Отметить дело выполненным
      description: 'Доступ: OWNER. Сервер фиксирует время. Повтор не создаёт второй факт.'
      security:
      - userJwt: []
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 66666666-6666-4666-8666-666666666666
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 66666666-6666-4666-8666-666666666666
                petId: 22222222-2222-4222-8222-222222222222
                title: Кормление
                scheduledAt: '2027-01-15T10:00:00Z'
                status: DONE
                completedAt: '2027-01-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/calendar:
    get:
      tags:
      - public
      operationId: care_service_get_api_v1_calendar
      summary: Объединённый календарь
      description: 'Доступ: OWNER. Интервал [from,to), сортировка scheduledAt,id; проекция обновляется асинхронно.'
      security:
      - userJwt: []
      parameters:
      - name: petId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 22222222-2222-4222-8222-222222222222
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2027-01-15T00:00:00Z'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2027-01-16T00:00:00Z'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPage'
              example:
                items:
                - id: 66666666-6666-4666-8666-666666666666
                  kind: CARE
                  title: Кормление
                  scheduledAt: '2027-01-15T10:00:00Z'
                  status: PENDING
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      additionalProperties: false
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        title:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - DONE
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - petId
      - title
      - scheduledAt
      - status
      - completedAt
      additionalProperties: false
    CreateTask:
      type: object
      properties:
        petId:
          type: string
          format: uuid
        title:
          type: string
        scheduledAt:
          type: string
          format: date-time
      required:
      - petId
      - title
      - scheduledAt
      additionalProperties: false
    TaskPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
    CalendarItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CARE
          - MEDICATION
        title:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - DONE
          - TAKEN
          - SKIPPED
      required:
      - id
      - kind
      - title
      - scheduledAt
      - status
      additionalProperties: false
    CalendarPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarItem'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
