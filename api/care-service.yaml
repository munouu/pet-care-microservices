openapi: 3.0.3
info:
  title: care-service
  version: 1.0.0
  description: 'Однократные дела ухода и календарь. Медицинские строки — проекция health-service; запись медицинских фактов через care-service
    запрещена. Все публичные вызовы требуют JWT Keycloak; userId берётся из sub. Доступ к питомцу проверяется через pet-service. Публичные
    изменения требуют Idempotency-Key: ключ связан с sub, методом, путём и телом; результат хранится 24 часа. Повтор завершённого запроса
    возвращает прежний результат, другое тело — 409. Для активации возвращается прежняя operationId; для ещё выполняющегося обычного
    запроса — 409 с code=IN_PROGRESS.'
servers:
- {url: 'https://api.pet-care.example', description: API Gateway}
security:
- userJwt: []
tags:
- {name: public, description: Клиент через Gateway}
- {name: internal, description: Только сервисы внутренней сети}
paths:
  /api/v1/care/tasks:
    post:
      tags:
      - public
      summary: Запланировать дело
      description: Проверяет владельца. scheduledAt должен быть в будущем; повторяющихся планов нет.
      operationId: care_post_api_v1_care_tasks
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
              example:
                id: 11111111-1111-4111-8111-111111111111
                petId: 11111111-1111-4111-8111-111111111111
                title: Утреннее кормление
                scheduledAt: '2026-11-01T08:00:00Z'
                status: PENDING
                completedAt: null
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTask'}
            example: {petId: 11111111-1111-4111-8111-111111111111, title: Утреннее кормление, scheduledAt: '2026-11-01T08:00:00Z'}
    get:
      tags:
      - public
      summary: Дела питомца
      description: Сортировка scheduledAt ASC, id ASC. Возвращаются только данные владельца. page начинается с 1, size — 1–100, за пределами
        списка items=[].
      operationId: care_get_api_v1_care_tasks
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  petId: 11111111-1111-4111-8111-111111111111
                  title: Утреннее кормление
                  scheduledAt: '2026-11-01T08:00:00Z'
                  status: PENDING
                  completedAt: null
                page: 1
                size: 20
                total: 1
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/PetId'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET ''https://api.pet-care.example/api/v1/care/tasks?petId=11111111-1111-4111-8111-111111111111&page=1&size=20''
          -H ''Authorization: Bearer <JWT>'''
  /api/v1/care/tasks/{id}/completion:
    post:
      tags:
      - public
      summary: Отметить дело выполненным
      description: Без тела. Атомарный переход PENDING → DONE; completedAt задаёт сервер. Другое повторное выполнение — 409; тот же
        Idempotency-Key возвращает прежний ответ.
      operationId: care_post_api_v1_care_tasks_id_completion
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
              example:
                id: 11111111-1111-4111-8111-111111111111
                petId: 11111111-1111-4111-8111-111111111111
                title: Утреннее кормление
                scheduledAt: '2026-11-01T08:00:00Z'
                status: DONE
                completedAt: '2026-11-01T08:00:00Z'
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      x-codeSamples:
      - lang: Shell
        source: 'curl -X POST ''https://api.pet-care.example/api/v1/care/tasks/11111111-1111-4111-8111-111111111111/completion'' -H
          ''Authorization: Bearer <JWT>'' -H ''Idempotency-Key: 11111111-1111-4111-8111-111111111111'''
  /api/v1/calendar:
    get:
      tags:
      - public
      summary: Календарь питомца
      description: Сортировка scheduledAt, source, id. CARE — собственное дело, HEALTH — только чтение. PREPARED-проекции скрыты. Копия
        может отставать от здоровья; отметка приёма направляется в health-service. Возвращаются только данные владельца. page начинается
        с 1, size — 1–100, за пределами списка items=[].
      operationId: care_get_api_v1_calendar
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarEntryPage'}
              example:
                items:
                - {id: 11111111-1111-4111-8111-111111111111, petId: 11111111-1111-4111-8111-111111111111, source: CARE, title: Утреннее
                    кормление, scheduledAt: '2026-11-01T08:00:00Z', status: PENDING}
                page: 1
                size: 20
                total: 1
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/PetId'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET ''https://api.pet-care.example/api/v1/calendar?petId=11111111-1111-4111-8111-111111111111&page=1&size=20''
          -H ''Authorization: Bearer <JWT>'''
  /internal/v1/courses/{activationId}/projection:
    put:
      tags:
      - internal
      summary: Подготовить проекцию
      description: Только health-service. Тело сохраняется атомарно вместе с activationId в состоянии PREPARED. Повтор с тем же телом
        — 204; другое тело или сохранённая отмена — 409. occurrenceId уникальны внутри снимка; ключ подготовленной записи — activationId
        + occurrenceId. Данные не видны пользователю и не отправляются до health.course.activated.
      operationId: care_put_internal_v1_courses_activationId_projection
      responses:
        '204': {description: 'Выполнено, без тела'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ActivationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseSnapshot'}
            example:
              courseId: 11111111-1111-4111-8111-111111111111
              petId: 11111111-1111-4111-8111-111111111111
              ownerId: 11111111-1111-4111-8111-111111111111
              title: Приём лекарства
              occurrences:
              - {id: 11111111-1111-4111-8111-111111111111, scheduledAt: '2026-11-01T08:00:00Z'}
      security:
      - serviceJwt: []
      servers:
      - {url: 'http://care-service:8080'}
      x-allowed-callers:
      - health-service
    delete:
      tags:
      - internal
      summary: Компенсировать подготовку
      description: 'Только health-service. Для PREPARED удаляется проекция / отменяются задания; в БД сохраняется отметка отмены activationId,
        даже если данных не было. Повторы — 204. Запоздавший PUT отклоняется. Уже применённая активация — 409: активный курс этой операцией
        не откатывается.'
      operationId: care_delete_internal_v1_courses_activationId_projection
      responses:
        '204': {description: 'Выполнено, без тела'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ActivationId'}
      security:
      - serviceJwt: []
      servers:
      - {url: 'http://care-service:8080'}
      x-allowed-callers:
      - health-service
      x-codeSamples:
      - {lang: Shell, source: 'curl -X DELETE ''http://care-service:8080/internal/v1/courses/11111111-1111-4111-8111-111111111111/projection''
          -H ''Authorization: Bearer <JWT>'''}
components:
  securitySchemes:
    userJwt: {type: http, scheme: bearer, bearerFormat: JWT, description: 'Проверяются подпись, issuer, audience и exp JWT пользователя.'}
    serviceJwt: {type: http, scheme: bearer, bearerFormat: JWT, description: Сервисный токен Keycloak с audience получателя. Проверяются
        client_id и разрешённый вызывающий сервис.}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID запроса; один ключ с другим телом даёт 409.
      schema: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
    PetId:
      name: petId
      in: query
      required: true
      description: Питомец текущего владельца.
      schema: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
    Page:
      name: page
      in: query
      description: Номер страницы.
      schema: {type: integer, example: 1, minimum: 1, default: 1}
    Size:
      name: size
      in: query
      description: Размер страницы.
      schema: {type: integer, example: 20, minimum: 1, maximum: 100, default: 20}
    Id:
      name: id
      in: path
      required: true
      description: UUID ресурса.
      schema: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
    ActivationId:
      name: activationId
      in: path
      required: true
      description: UUID попытки активации, одинаковый для обоих участников.
      schema: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
  responses:
    Error400:
      description: Некорректные параметры или тело запроса
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'about:blank', title: Некорректные параметры или тело запроса, status: 400, detail: Некорректные параметры
              или тело запроса., code: BAD_REQUEST}
    Error401:
      description: Недействительный или отсутствующий токен
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'about:blank', title: Недействительный или отсутствующий токен, status: 401, detail: Недействительный или
              отсутствующий токен., code: UNAUTHENTICATED}
    Error403:
      description: Питомец не принадлежит пользователю или сервис не допущен
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Питомец не принадлежит пользователю или сервис не допущен
            status: 403
            detail: Питомец не принадлежит пользователю или сервис не допущен.
            code: FORBIDDEN
    Error409:
      description: Конфликт состояния или ключа идемпотентности
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'about:blank', title: Конфликт состояния или ключа идемпотентности, status: 409, detail: Конфликт состояния
              или ключа идемпотентности., code: CONFLICT}
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'about:blank', title: Зависимость временно недоступна, status: 503, detail: Зависимость временно недоступна.,
            code: UNAVAILABLE}
    Error404:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'about:blank', title: Ресурс не найден, status: 404, detail: Ресурс не найден., code: NOT_FOUND}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - code
      properties:
        type: {type: string, example: 'about:blank', format: uri}
        title: {type: string, example: Ошибка запроса}
        status: {type: integer, example: 400, minimum: 400, maximum: 599}
        detail: {type: string, example: Проверьте параметры запроса.}
        code: {type: string, example: BAD_REQUEST}
    CreateTask:
      type: object
      additionalProperties: false
      required:
      - petId
      - title
      - scheduledAt
      properties:
        petId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        title: {type: string, example: Утреннее кормление, minLength: 1, maxLength: 200}
        scheduledAt: {type: string, example: '2026-11-01T08:00:00Z', format: date-time}
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - petId
      - title
      - scheduledAt
      - status
      - completedAt
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        petId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        title: {type: string, example: Утреннее кормление}
        scheduledAt: {type: string, example: '2026-11-01T08:00:00Z', format: date-time}
        status:
          type: string
          example: PENDING
          enum:
          - PENDING
          - DONE
        completedAt: {type: string, example: null, format: date-time, nullable: true}
    TaskPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        page: {type: integer, example: 1, minimum: 1}
        size: {type: integer, example: 20, minimum: 1, maximum: 100}
        total: {type: integer, example: 1, minimum: 0}
    CalendarEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - petId
      - source
      - title
      - scheduledAt
      - status
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        petId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        source:
          type: string
          example: CARE
          enum:
          - CARE
          - HEALTH
        title: {type: string, example: Утреннее кормление}
        scheduledAt: {type: string, example: '2026-11-01T08:00:00Z', format: date-time}
        status:
          type: string
          example: PENDING
          enum:
          - PENDING
          - DONE
          - TAKEN
          - SKIPPED
    CalendarEntryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalendarEntry'}
        page: {type: integer, example: 1, minimum: 1}
        size: {type: integer, example: 20, minimum: 1, maximum: 100}
        total: {type: integer, example: 1, minimum: 0}
    ScheduledOccurrence:
      type: object
      additionalProperties: false
      required:
      - id
      - scheduledAt
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        scheduledAt: {type: string, example: '2026-11-01T08:00:00Z', format: date-time}
    CourseSnapshot:
      type: object
      additionalProperties: false
      required:
      - courseId
      - petId
      - ownerId
      - title
      - occurrences
      properties:
        courseId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        petId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        ownerId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        title: {type: string, example: Приём лекарства}
        occurrences:
          type: array
          items: {$ref: '#/components/schemas/ScheduledOccurrence'}
          minItems: 1
          maxItems: 60
x-subscriptions:
- {eventType: health.course.activated, schema: health-service.yaml#/components/schemas/CourseActivated}
- {eventType: health.occurrence.completed, schema: health-service.yaml#/components/schemas/OccurrenceCompleted}
