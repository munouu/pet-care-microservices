openapi: 3.0.3
info:
  title: schedule-service
  version: 1.0.0
  description: Непересекающиеся интервалы врача и конкурентное резервирование. Слот принадлежит максимум одной
    действующей записи.
servers:
- url: https://api.pet-care.example
  description: API Gateway
security:
- userJwt: []
tags:
- name: public
  description: Клиент через Gateway
- name: internal
  description: Внутренняя сеть, service JWT
- name: webhook
  description: Подписанный callback PSP
paths:
  /api/v1/admin/slots:
    post:
      tags:
      - public
      operationId: schedule_service_post_api_v1_admin_slots
      summary: Создать слот врача
      description: 'Доступ: CLINIC_ADMIN. Врач зарегистрирован; startAt в будущем, endAt > startAt, запрещено
        пересечение слотов одного врача.'
      security:
      - userJwt: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSlot'
            example:
              vetId: 44444444-4444-4444-8444-444444444444
              startAt: '2027-01-15T10:00:00Z'
              endAt: '2027-01-15T10:30:00Z'
              feeKopecks: 150000
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
              example:
                id: 55555555-5555-4555-8555-555555555555
                vetId: 44444444-4444-4444-8444-444444444444
                startAt: '2027-01-15T10:00:00Z'
                endAt: '2027-01-15T10:30:00Z'
                feeKopecks: 150000
                status: FREE
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/slots:
    get:
      tags:
      - public
      operationId: schedule_service_get_api_v1_slots
      summary: Найти свободные слоты
      description: 'Доступ: OWNER. Только FREE, интервал [from,to), сортировка startAt,id.'
      security:
      - userJwt: []
      parameters:
      - name: vetId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        example: 44444444-4444-4444-8444-444444444444
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2027-01-15T00:00:00Z'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2027-01-16T00:00:00Z'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotPage'
              example:
                items:
                - id: 55555555-5555-4555-8555-555555555555
                  vetId: 44444444-4444-4444-8444-444444444444
                  startAt: '2027-01-15T10:00:00Z'
                  endAt: '2027-01-15T10:30:00Z'
                  feeKopecks: 150000
                  status: FREE
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/reservations:
    post:
      tags:
      - internal
      operationId: schedule_service_post_internal_v1_reservations
      summary: Удержать слот
      description: 'Доступ: appointment-service. HELD до min(now+15 мин,startAt). Атомарно проверить FREE.
        Повтор appointmentId не продлевает TTL; tombstone отмены блокирует поздний POST.'
      security:
      - serviceJwt: []
      servers:
      - url: http://schedule-service
        description: Внутренняя сеть
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slotId:
                  type: string
                  format: uuid
                appointmentId:
                  type: string
                  format: uuid
              required:
              - slotId
              - appointmentId
              additionalProperties: false
            example:
              slotId: 55555555-5555-4555-8555-555555555555
              appointmentId: 33333333-3333-4333-8333-333333333333
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                slotId: 55555555-5555-4555-8555-555555555555
                appointmentId: 33333333-3333-4333-8333-333333333333
                vetId: 44444444-4444-4444-8444-444444444444
                startAt: '2027-01-15T10:00:00Z'
                feeKopecks: 150000
                expiresAt: '2027-01-15T09:15:00Z'
                status: HELD
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/reservations/{appointmentId}/confirmation:
    put:
      tags:
      - internal
      operationId: schedule_service_put_internal_v1_reservations_appointmentId_confirmation
      summary: Подтвердить резерв
      description: 'Доступ: appointment-service. HELD → BOOKED до expiresAt. Повтор BOOKED безопасен; EXPIRED/RELEASED
        — 409.'
      security:
      - serviceJwt: []
      servers:
      - url: http://schedule-service
        description: Внутренняя сеть
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                slotId: 55555555-5555-4555-8555-555555555555
                appointmentId: 33333333-3333-4333-8333-333333333333
                vetId: 44444444-4444-4444-8444-444444444444
                startAt: '2027-01-15T10:00:00Z'
                feeKopecks: 150000
                expiresAt: '2027-01-15T09:15:00Z'
                status: BOOKED
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/reservations/{appointmentId}:
    delete:
      tags:
      - internal
      operationId: schedule_service_delete_internal_v1_reservations_appointmentId
      summary: Освободить резерв
      description: 'Доступ: appointment-service. Освобождает только собственный HELD/BOOKED. Сохраняет tombstone
        даже при отсутствии резерва. Не освобождает бронь другой записи.'
      security:
      - serviceJwt: []
      servers:
      - url: http://schedule-service
        description: Внутренняя сеть
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
                additionalProperties: false
              example:
                ok: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      additionalProperties: false
    Slot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vetId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        feeKopecks:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - FREE
          - HELD
          - BOOKED
      required:
      - id
      - vetId
      - startAt
      - endAt
      - feeKopecks
      - status
      additionalProperties: false
    CreateSlot:
      type: object
      properties:
        vetId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        feeKopecks:
          type: integer
          minimum: 1
      required:
      - vetId
      - startAt
      - endAt
      - feeKopecks
      additionalProperties: false
    SlotPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
    Reservation:
      type: object
      properties:
        slotId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        vetId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        feeKopecks:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - HELD
          - BOOKED
          - RELEASED
          - EXPIRED
      required:
      - slotId
      - appointmentId
      - vetId
      - startAt
      - feeKopecks
      - expiresAt
      - status
      additionalProperties: false
    SlotExpired:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - slot.expired
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          properties:
            appointmentId:
              type: string
              format: uuid
            slotId:
              type: string
              format: uuid
          required:
          - appointmentId
          - slotId
          additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
