openapi: 3.0.3
info:
  title: pet-service
  version: 1.0.0
  description: Единственный источник владения. ownerId неизменяем и берётся из sub токена.
servers:
- url: https://api.pet-care.example
  description: API Gateway
security:
- userJwt: []
tags:
- name: public
  description: Клиент через Gateway
- name: internal
  description: Внутренняя сеть, service JWT
- name: webhook
  description: Подписанный callback PSP
paths:
  /api/v1/pets:
    post:
      tags:
      - public
      operationId: pet_service_post_api_v1_pets
      summary: Создать питомца
      description: 'Доступ: OWNER. '
      security:
      - userJwt: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePet'
            example:
              name: Барсик
              species: CAT
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              example:
                id: 22222222-2222-4222-8222-222222222222
                ownerId: 11111111-1111-4111-8111-111111111111
                name: Барсик
                species: CAT
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      tags:
      - public
      operationId: pet_service_get_api_v1_pets
      summary: Список своих питомцев
      description: 'Доступ: OWNER. '
      security:
      - userJwt: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPage'
              example:
                items:
                - id: 22222222-2222-4222-8222-222222222222
                  ownerId: 11111111-1111-4111-8111-111111111111
                  name: Барсик
                  species: CAT
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/pets/{petId}:
    get:
      tags:
      - public
      operationId: pet_service_get_api_v1_pets_petId
      summary: Получить профиль своего питомца
      description: 'Доступ: OWNER. '
      security:
      - userJwt: []
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 22222222-2222-4222-8222-222222222222
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              example:
                id: 22222222-2222-4222-8222-222222222222
                ownerId: 11111111-1111-4111-8111-111111111111
                name: Барсик
                species: CAT
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/access/check:
    post:
      tags:
      - internal
      operationId: pet_service_post_internal_v1_access_check
      summary: Проверить владельца
      description: 'Доступ: care-service, health-service, appointment-service. ownerId проверен вызывающим
        сервисом; при отказе не возвращать персональные данные.'
      security:
      - serviceJwt: []
      servers:
      - url: http://pet-service
        description: Внутренняя сеть
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                petId:
                  type: string
                  format: uuid
                ownerId:
                  type: string
                  format: uuid
              required:
              - petId
              - ownerId
              additionalProperties: false
            example:
              petId: 22222222-2222-4222-8222-222222222222
              ownerId: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                required:
                - allowed
                additionalProperties: false
              example:
                allowed: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      additionalProperties: false
    Pet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        species:
          type: string
          enum:
          - CAT
          - DOG
          - OTHER
      required:
      - id
      - ownerId
      - name
      - species
      additionalProperties: false
    CreatePet:
      type: object
      properties:
        name:
          type: string
        species:
          type: string
          enum:
          - CAT
          - DOG
          - OTHER
      required:
      - name
      - species
      additionalProperties: false
    PetPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
