openapi: 3.0.3
info:
  title: payment-service
  version: 1.0.0
  description: Предоплата, callback, отмена и возврат.
servers:
- url: https://api.pet-care.example
  description: API Gateway
- url: http://localhost:8080
  description: Локальный Gateway
tags:
- {name: internal, description: 'Внутренняя сеть, service JWT'}
- {name: webhook, description: Подписанный callback PSP}
paths:
  /internal/v1/payments:
    post:
      tags: [internal]
      operationId: payment_service_post_internal_v1_payments
      summary: Создать платёжную сессию
      description: 'Доступ: appointment-service. Сохранить платёж до вызова PSP; повтор с appointmentId не
        создаёт вторую сессию. Отменённая попытка не создаётся заново.'
      security:
      - serviceJwt: []
      - mockService: []
      servers:
      - url: http://payment:8004
        description: Внутренняя сеть
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointmentId: {type: string, format: uuid}
                amountKopecks: {type: integer, minimum: 1}
                currency:
                  type: string
                  enum: [RUB]
                expiresAt: {type: string, format: date-time}
              required: [appointmentId, amountKopecks, currency, expiresAt]
              additionalProperties: false
            example:
              appointmentId: 33333333-3333-4333-8333-333333333333
              amountKopecks: 150000
              currency: RUB
              expiresAt: '2027-01-15T09:15:00Z'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
              example:
                id: 88888888-8888-4888-8888-888888888888
                appointmentId: 33333333-3333-4333-8333-333333333333
                amountKopecks: 150000
                currency: RUB
                status: INITIATED
                paymentUrl: https://pay.example/session/123
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
  /internal/v1/payments/{appointmentId}/cancellation:
    put:
      tags: [internal]
      operationId: payment_service_put_internal_v1_payments_appointmentId_cancellation
      summary: Отменить сессию или вернуть платёж
      description: 'Доступ: appointment-service. Сохранённое намерение отмены. При списании полный возврат,
        иначе отмена сессии. Позднее списание также возвращается. Если попытки нет, сохраняется отметка отмены.
        202 означает принятую ответственность, не возврат.'
      security:
      - serviceJwt: []
      - mockService: []
      servers:
      - url: http://payment:8004
        description: Внутренняя сеть
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
        example: 33333333-3333-4333-8333-333333333333
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: Принято в обработку
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                required: [ok]
                additionalProperties: false
              example:
                ok: true
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
  /internal/v1/payments/{appointmentId}:
    get:
      tags: [internal]
      operationId: payment_service_get_internal_v1_payments_appointmentId
      summary: Проверить состояние платежа
      description: 'Доступ: appointment-service. Текущий статус, сохранённый по результатам операций и callback
        PSP.'
      security:
      - serviceJwt: []
      - mockService: []
      servers:
      - url: http://payment:8004
        description: Внутренняя сеть
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
        example: 33333333-3333-4333-8333-333333333333
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
              example:
                id: 88888888-8888-4888-8888-888888888888
                appointmentId: 33333333-3333-4333-8333-333333333333
                amountKopecks: 150000
                currency: RUB
                status: INITIATED
                paymentUrl: https://pay.example/session/123
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
  /webhooks/payments:
    post:
      tags: [webhook]
      operationId: payment_service_post_webhooks_payments
      summary: Принять подписанный callback PSP
      description: 'Доступ: PSP. HMAC сырого тела, проверка providerPaymentId, appointmentId и суммы, дедупликация
        providerEventId. Финальный REFUNDED не понижается.'
      security:
      - providerSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerEventId: {type: string}
                providerPaymentId: {type: string}
                appointmentId: {type: string, format: uuid}
                status:
                  type: string
                  enum: [SUCCEEDED, FAILED, REFUNDED]
                amountKopecks: {type: integer, minimum: 1}
                currency:
                  type: string
                  enum: [RUB]
              required: [providerEventId, providerPaymentId, appointmentId, status, amountKopecks, currency]
              additionalProperties: false
            example:
              providerEventId: evt_001
              providerPaymentId: pay_001
              appointmentId: 33333333-3333-4333-8333-333333333333
              status: SUCCEEDED
              amountKopecks: 150000
              currency: RUB
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                required: [ok]
                additionalProperties: false
              example:
                ok: true
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
components:
  securitySchemes:
    serviceJwt: {type: http, scheme: bearer, bearerFormat: JWT}
    providerSignature: {type: apiKey, in: header, name: X-Provider-Signature}
    mockService:
      type: apiKey
      in: header
      name: X-Service
      description: Локальная заглушка service JWT
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
      required: [type, title, status, detail, code, correlationId]
      additionalProperties: false
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        appointmentId: {type: string, format: uuid}
        amountKopecks: {type: integer, minimum: 1}
        currency:
          type: string
          enum: [RUB]
        status:
          type: string
          enum: [INITIATED, COMPLETED, FAILED, CANCELLED, REFUND_PENDING, REFUNDED]
        paymentUrl: {type: string, format: uri, nullable: true}
      required: [id, appointmentId, amountKopecks, currency, status, paymentUrl]
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      example: 11111111-1111-4111-8111-111111111111
      description: Ключ одной логической операции; повтор с другим телом — 409.
