openapi: 3.0.3
info:
  title: health-service
  version: 1.0.0
  description: 'Курс создаёт врач завершённого визита; владелец отмечает факты. Курс сохраняется независимо
    от уведомлений. MVP: назначения неизменяемы.'
servers:
- url: https://api.pet-care.example
  description: API Gateway
security:
- userJwt: []
tags:
- name: public
  description: Клиент через Gateway
- name: internal
  description: Внутренняя сеть, service JWT
- name: webhook
  description: Подписанный callback PSP
paths:
  /api/v1/health/courses:
    post:
      tags:
      - public
      operationId: health_service_post_api_v1_health_courses
      summary: Оформить курс лечения
      description: 'Доступ: VET. Проверить COMPLETED и назначенного врача через appointment-service. Первый
        приём в будущем. Сохранить курс, все UUID приёмов и outbox одной транзакцией.'
      security:
      - userJwt: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourse'
            example:
              appointmentId: 33333333-3333-4333-8333-333333333333
              medication: Препарат по назначению
              dose: Доза по назначению
              firstDoseAt: '2027-01-16T08:00:00Z'
              intervalHours: 24
              doseCount: 7
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              example:
                id: 66666666-6666-4666-8666-666666666666
                appointmentId: 33333333-3333-4333-8333-333333333333
                petId: 22222222-2222-4222-8222-222222222222
                vetId: 44444444-4444-4444-8444-444444444444
                medication: Препарат по назначению
                dose: Доза по назначению
                firstDoseAt: '2027-01-16T08:00:00Z'
                intervalHours: 24
                doseCount: 7
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      tags:
      - public
      operationId: health_service_get_api_v1_health_courses
      summary: История назначений своего питомца
      description: 'Доступ: OWNER. '
      security:
      - userJwt: []
      parameters:
      - name: petId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 22222222-2222-4222-8222-222222222222
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
              example:
                items:
                - id: 66666666-6666-4666-8666-666666666666
                  appointmentId: 33333333-3333-4333-8333-333333333333
                  petId: 22222222-2222-4222-8222-222222222222
                  vetId: 44444444-4444-4444-8444-444444444444
                  medication: Препарат по назначению
                  dose: Доза по назначению
                  firstDoseAt: '2027-01-16T08:00:00Z'
                  intervalHours: 24
                  doseCount: 7
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/health/visits/{appointmentId}/courses:
    get:
      tags:
      - public
      operationId: health_service_get_api_v1_health_visits_appointmentId_courses
      summary: История пациента для врача
      description: 'Доступ: VET. Только назначенный врач подтверждённого/завершённого визита; petId определяется
        через appointment-service.'
      security:
      - userJwt: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
              example:
                items:
                - id: 66666666-6666-4666-8666-666666666666
                  appointmentId: 33333333-3333-4333-8333-333333333333
                  petId: 22222222-2222-4222-8222-222222222222
                  vetId: 44444444-4444-4444-8444-444444444444
                  medication: Препарат по назначению
                  dose: Доза по назначению
                  firstDoseAt: '2027-01-16T08:00:00Z'
                  intervalHours: 24
                  doseCount: 7
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/health/courses/{courseId}/occurrences:
    get:
      tags:
      - public
      operationId: health_service_get_api_v1_health_courses_courseId_occurrences
      summary: Расписание приёмов лекарства
      description: 'Доступ: OWNER. '
      security:
      - userJwt: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 66666666-6666-4666-8666-666666666666
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrencePage'
              example:
                items:
                - id: 77777777-7777-4777-8777-777777777777
                  courseId: 66666666-6666-4666-8666-666666666666
                  scheduledAt: '2027-01-16T08:00:00Z'
                  status: PENDING
                  recordedAt: null
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/health/occurrences/{occurrenceId}/completion:
    put:
      tags:
      - public
      operationId: health_service_put_api_v1_health_occurrences_occurrenceId_completion
      summary: Отметить приём
      description: 'Доступ: OWNER. PENDING → TAKEN/SKIPPED. Повтор того же статуса безопасен; смена конечного
        — 409. Отметка и outbox атомарны.'
      security:
      - userJwt: []
      parameters:
      - name: occurrenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 77777777-7777-4777-8777-777777777777
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - TAKEN
                  - SKIPPED
              required:
              - status
              additionalProperties: false
            example:
              status: TAKEN
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
              example:
                id: 77777777-7777-4777-8777-777777777777
                courseId: 66666666-6666-4666-8666-666666666666
                scheduledAt: '2027-01-16T08:00:00Z'
                status: TAKEN
                recordedAt: '2027-01-16T08:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/health/occurrences/{occurrenceId}:
    get:
      tags:
      - internal
      operationId: health_service_get_internal_v1_health_occurrences_occurrenceId
      summary: Проверить актуальность напоминания
      description: 'Доступ: notification-service. '
      security:
      - serviceJwt: []
      servers:
      - url: http://health-service
        description: Внутренняя сеть
      parameters:
      - name: occurrenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 77777777-7777-4777-8777-777777777777
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
              example:
                id: 77777777-7777-4777-8777-777777777777
                courseId: 66666666-6666-4666-8666-666666666666
                scheduledAt: '2027-01-16T08:00:00Z'
                status: PENDING
                recordedAt: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      additionalProperties: false
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        vetId:
          type: string
          format: uuid
        medication:
          type: string
        dose:
          type: string
        firstDoseAt:
          type: string
          format: date-time
        intervalHours:
          type: integer
          minimum: 1
          maximum: 168
        doseCount:
          type: integer
          minimum: 1
          maximum: 60
      required:
      - id
      - appointmentId
      - petId
      - vetId
      - medication
      - dose
      - firstDoseAt
      - intervalHours
      - doseCount
      additionalProperties: false
    CreateCourse:
      type: object
      properties:
        appointmentId:
          type: string
          format: uuid
        medication:
          type: string
        dose:
          type: string
        firstDoseAt:
          type: string
          format: date-time
        intervalHours:
          type: integer
          minimum: 1
          maximum: 168
        doseCount:
          type: integer
          minimum: 1
          maximum: 60
      required:
      - appointmentId
      - medication
      - dose
      - firstDoseAt
      - intervalHours
      - doseCount
      additionalProperties: false
    CoursePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
    Occurrence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - TAKEN
          - SKIPPED
        recordedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - courseId
      - scheduledAt
      - status
      - recordedAt
      additionalProperties: false
    OccurrencePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Occurrence'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
    HealthCourseCreated:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - health.course.created
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          properties:
            courseId:
              type: string
              format: uuid
            petId:
              type: string
              format: uuid
            ownerId:
              type: string
              format: uuid
            medication:
              type: string
            occurrences:
              type: array
              items:
                type: object
                properties:
                  occurrenceId:
                    type: string
                    format: uuid
                  scheduledAt:
                    type: string
                    format: date-time
                required:
                - occurrenceId
                - scheduledAt
                additionalProperties: false
          required:
          - courseId
          - petId
          - ownerId
          - medication
          - occurrences
          additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      additionalProperties: false
    HealthOccurrenceCompleted:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - health.occurrence.completed
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          properties:
            courseId:
              type: string
              format: uuid
            petId:
              type: string
              format: uuid
            occurrenceId:
              type: string
              format: uuid
            status:
              type: string
              enum:
              - TAKEN
              - SKIPPED
            recordedAt:
              type: string
              format: date-time
          required:
          - courseId
          - petId
          - occurrenceId
          - status
          - recordedAt
          additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
