openapi: 3.0.3
info:
  title: appointment-service
  version: 1.0.0
  description: Оркестратор саги. OWNER видит свои записи, VET — назначенные, CLINIC_ADMIN — записи одной клиники.
    Сумма и время — снимок schedule.
servers:
- url: https://api.pet-care.example
  description: API Gateway
security:
- userJwt: []
tags:
- name: public
  description: Клиент через Gateway
- name: internal
  description: Внутренняя сеть, service JWT
- name: webhook
  description: Подписанный callback PSP
paths:
  /api/v1/appointments:
    post:
      tags:
      - public
      operationId: appointment_service_post_api_v1_appointments
      summary: Начать запись
      description: 'Доступ: OWNER. Проверить ownerId через pet-service, сохранить PREPARING и ключ. Сумма не
        принимается от клиента. GET возвращает актуальный статус и ссылку.'
      security:
      - userJwt: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                petId:
                  type: string
                  format: uuid
                slotId:
                  type: string
                  format: uuid
              required:
              - petId
              - slotId
              additionalProperties: false
            example:
              petId: 22222222-2222-4222-8222-222222222222
              slotId: 55555555-5555-4555-8555-555555555555
      responses:
        '202':
          description: Принято в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 22222222-2222-4222-8222-222222222222
                slotId: 55555555-5555-4555-8555-555555555555
                ownerId: 11111111-1111-4111-8111-111111111111
                vetId: null
                startAt: null
                amountKopecks: null
                status: PREPARING
                paymentStatus: NOT_STARTED
                paymentUrl: null
                expiresAt: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      tags:
      - public
      operationId: appointment_service_get_api_v1_appointments
      summary: Список доступных записей
      description: 'Доступ: OWNER / VET / CLINIC_ADMIN. Фильтр по роли и владельцу/ветеринару; сортировка id.'
      security:
      - userJwt: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PREPARING
          - PENDING_PAYMENT
          - CONFIRMING
          - CONFIRMED
          - CANCELLING
          - CANCELLED
          - COMPLETED
        example: CONFIRMED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPage'
              example:
                items:
                - id: 33333333-3333-4333-8333-333333333333
                  petId: 22222222-2222-4222-8222-222222222222
                  slotId: 55555555-5555-4555-8555-555555555555
                  ownerId: 11111111-1111-4111-8111-111111111111
                  vetId: 44444444-4444-4444-8444-444444444444
                  startAt: '2027-01-15T10:00:00Z'
                  amountKopecks: 150000
                  status: PENDING_PAYMENT
                  paymentStatus: PENDING
                  paymentUrl: https://pay.example/session/123
                  expiresAt: '2027-01-15T09:15:00Z'
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/appointments/{appointmentId}:
    get:
      tags:
      - public
      operationId: appointment_service_get_api_v1_appointments_appointmentId
      summary: Статус записи
      description: 'Доступ: OWNER / VET / CLINIC_ADMIN. Ссылка оплаты только владельцу при PENDING_PAYMENT.
        Для отменённых записей доступна проекция статуса возврата.'
      security:
      - userJwt: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 22222222-2222-4222-8222-222222222222
                slotId: 55555555-5555-4555-8555-555555555555
                ownerId: 11111111-1111-4111-8111-111111111111
                vetId: 44444444-4444-4444-8444-444444444444
                startAt: '2027-01-15T10:00:00Z'
                amountKopecks: 150000
                status: PENDING_PAYMENT
                paymentStatus: PENDING
                paymentUrl: https://pay.example/session/123
                expiresAt: '2027-01-15T09:15:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/appointments/{appointmentId}/cancellation:
    put:
      tags:
      - public
      operationId: appointment_service_put_api_v1_appointments_appointmentId_cancellation
      summary: Запросить отмену
      description: 'Доступ: OWNER / CLINIC_ADMIN. До начала визита, COMPLETED не отменяется. PREPARING без
        известного времени можно отменить. Полный возврат при списании. 202 не означает возврат денег.'
      security:
      - userJwt: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      responses:
        '202':
          description: Принято в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 22222222-2222-4222-8222-222222222222
                slotId: 55555555-5555-4555-8555-555555555555
                ownerId: 11111111-1111-4111-8111-111111111111
                vetId: 44444444-4444-4444-8444-444444444444
                startAt: '2027-01-15T10:00:00Z'
                amountKopecks: 150000
                status: CANCELLING
                paymentStatus: CANCELLATION_PENDING
                paymentUrl: null
                expiresAt: '2027-01-15T09:15:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/appointments/{appointmentId}/completion:
    put:
      tags:
      - public
      operationId: appointment_service_put_api_v1_appointments_appointmentId_completion
      summary: Завершить посещение
      description: 'Доступ: VET. Только назначенный врач, CONFIRMED и now >= startAt.'
      security:
      - userJwt: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Ключ одной логической операции; повтор с другим телом — 409.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 22222222-2222-4222-8222-222222222222
                slotId: 55555555-5555-4555-8555-555555555555
                ownerId: 11111111-1111-4111-8111-111111111111
                vetId: 44444444-4444-4444-8444-444444444444
                startAt: '2027-01-15T10:00:00Z'
                amountKopecks: 150000
                status: COMPLETED
                paymentStatus: PAID
                paymentUrl: null
                expiresAt: '2027-01-15T09:15:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/appointments/{appointmentId}/access:
    get:
      tags:
      - internal
      operationId: appointment_service_get_internal_v1_appointments_appointmentId_access
      summary: Проверить доступ врача к пациенту
      description: 'Доступ: health-service. vetId проверен health-service по JWT. 403 для другого врача/отменённого
        визита; создание курса только для COMPLETED.'
      security:
      - serviceJwt: []
      servers:
      - url: http://appointment-service
        description: Внутренняя сеть
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 33333333-3333-4333-8333-333333333333
      - name: vetId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 44444444-4444-4444-8444-444444444444
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  petId:
                    type: string
                    format: uuid
                  ownerId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - CONFIRMED
                    - COMPLETED
                required:
                - petId
                - ownerId
                - status
                additionalProperties: false
              example:
                petId: 22222222-2222-4222-8222-222222222222
                ownerId: 11111111-1111-4111-8111-111111111111
                status: COMPLETED
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      additionalProperties: false
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        vetId:
          type: string
          format: uuid
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        amountKopecks:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
          - PREPARING
          - PENDING_PAYMENT
          - CONFIRMING
          - CONFIRMED
          - CANCELLING
          - CANCELLED
          - COMPLETED
        paymentStatus:
          type: string
          enum:
          - NOT_STARTED
          - PENDING
          - PAID
          - FAILED
          - CANCELLATION_PENDING
          - CANCELLED
          - REFUND_PENDING
          - REFUNDED
        paymentUrl:
          type: string
          format: uri
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - petId
      - slotId
      - ownerId
      - vetId
      - startAt
      - amountKopecks
      - status
      - paymentStatus
      - paymentUrl
      - expiresAt
      additionalProperties: false
    AppointmentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
      additionalProperties: false
    AppointmentConfirmed:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - appointment.confirmed
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          properties:
            appointmentId:
              type: string
              format: uuid
            ownerId:
              type: string
              format: uuid
            petId:
              type: string
              format: uuid
            vetId:
              type: string
              format: uuid
            startAt:
              type: string
              format: date-time
          required:
          - appointmentId
          - ownerId
          - petId
          - vetId
          - startAt
          additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      additionalProperties: false
    AppointmentCancelled:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - appointment.cancelled
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          properties:
            appointmentId:
              type: string
              format: uuid
            ownerId:
              type: string
              format: uuid
            petId:
              type: string
              format: uuid
            reason:
              type: string
          required:
          - appointmentId
          - ownerId
          - petId
          - reason
          additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      additionalProperties: false
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/400
            title: Некорректные параметры
            status: 400
            detail: Некорректные параметры
            code: INVALID_INPUT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error401:
      description: Нет действительной аутентификации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/401
            title: Нет действительной аутентификации
            status: 401
            detail: Нет действительной аутентификации
            code: UNAUTHENTICATED
            correlationId: 11111111-1111-4111-8111-111111111111
    Error403:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/403
            title: Недостаточно прав
            status: 403
            detail: Недостаточно прав
            code: FORBIDDEN
            correlationId: 11111111-1111-4111-8111-111111111111
    Error404:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/404
            title: Объект не найден
            status: 404
            detail: Объект не найден
            code: NOT_FOUND
            correlationId: 11111111-1111-4111-8111-111111111111
    Error409:
      description: Конфликт состояния или ключа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/409
            title: Конфликт состояния или ключа
            status: 409
            detail: Конфликт состояния или ключа
            code: CONFLICT
            correlationId: 11111111-1111-4111-8111-111111111111
    Error503:
      description: Зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pet-care.example/problems/503
            title: Зависимость временно недоступна
            status: 503
            detail: Зависимость временно недоступна
            code: DEPENDENCY_UNAVAILABLE
            correlationId: 11111111-1111-4111-8111-111111111111
